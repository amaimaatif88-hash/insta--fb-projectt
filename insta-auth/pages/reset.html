<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset password</title><link rel="stylesheet" href="../styles/base.css"></head>
<body>
  <div class="card">
    <div class="lock">🔒</div>
    <h2>Trouble logging in?</h2>
    <p class="hint">Enter your email and we'll send you a link to get back into your account.</p>
    <form id="resetForm">
      <div class="field"><input id="rmail" type="email" required placeholder=" "><label>Email</label></div>
      <button class="primary">Send login link</button>
    </form>
    <p class="msg" id="msg"></p>
    <a class="link" href="../index.html">Back to sign in</a>
  </div>
  <script>
    document.getElementById("resetForm").onsubmit = function (e) {
      e.preventDefault();
      document.getElementById("msg").innerText = "If " + document.getElementById("rmail").value + " exists, a link was sent (demo).";
    };
  </script>
</body>
</html>
