<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Log in to Facebook</title>
  <link rel="stylesheet" href="assets/main.css">
</head>
<body class="dark">
  <header class="topbar">
    <span class="brand">facebook</span>
    <button id="themeToggle" class="theme-btn">☀ Light</button>
  </header>

  <section class="login-area">
    <h2>Log in to Facebook</h2>
    <form id="fbForm" novalidate>
      <label for="uid">Email or mobile number</label>
      <input id="uid" type="text" autocomplete="off">
      <small class="err" data-for="uid"></small>

      <label for="pwd">Password</label>
      <div class="pwd-wrap">
        <input id="pwd" type="password">
        <span id="eye" class="eye">Show</span>
      </div>
      <small class="err" data-for="pwd"></small>

      <div class="remember"><input type="checkbox" id="rem"><label for="rem">Keep me logged in</label></div>
      <button type="submit" id="submitBtn">Log in</button>
    </form>
    <div class="links">
      <a href="#">Forgotten account?</a> · <a href="register.html">Sign up for Facebook</a>
    </div>
  </section>

  <div id="toast" class="toast"></div>
  <script src="assets/app.js"></script>
</body>
</html>
